[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pangi-agent"
dynamic = ["version"]
description = "A lightweight, organization-operated agent runtime"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.20,<1",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "typer>=0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mcp = [
  "jsonschema>=4.23,<5",
]
openai = [
  "jsonschema>=4.23,<5",
  "openai>=2,<3",
]
bedrock = [
  "boto3>=1.43.68,<2",
  "jsonschema>=4.23,<5",
]
dev = [
  "httpx2>=2,<3",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
pangi = "pangi.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "pangi._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pangi = [
  "py.typed",
  "adapters/outbound/persistence/sqlite/migrations/*.sql",
  "builtins/resources/*.json",
  "web/static/*.html",
  "web/static/*.json",
  "web/static/assets/*",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
